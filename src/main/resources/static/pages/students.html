<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Students</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/tables.css" />
<link rel="stylesheet" href="../css/forms.css" />
</head>
<body>
<div class="app-shell" id="app-shell">
  <div id="page-content">
    <div class="page-header">
      <div>
        <h1>Students</h1>
        <p id="page-sub">Search and manage student records.</p>
      </div>
      <div class="actions">
        <a class="btn btn-primary hidden" id="add-student-btn" href="student-form.html">➕ Add Student</a>
      </div>
    </div>

    <div class="card">
      <div class="table-toolbar">
        <div class="search-input-wrap">
          <span class="ic">🔍</span>
          <input type="text" id="search-input" placeholder="Search by name, register / admission / EMIS number" />
        </div>
        <div class="filters">
          <select id="standard-filter"><option value="">All Standards</option></select>
          <select id="section-filter"><option value="">All Sections/Groups</option></select>
        </div>
      </div>
      <div id="students-region"><div class="state-block"><div class="spinner"></div>Loading students...</div></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<div id="modal-root"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/academic.js"></script>
<script src="../js/students.js"></script>
</body>
</html>
