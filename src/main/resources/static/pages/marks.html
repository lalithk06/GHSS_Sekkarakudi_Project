<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Marks Entry</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/tables.css" />
<link rel="stylesheet" href="../css/forms.css" />
</head>
<body>
<div class="app-shell" id="app-shell">
  <div id="page-content">
    <div class="page-header">
      <div>
        <h1>Marks Entry</h1>
        <p>Enter or update marks for your assigned class and subject.</p>
      </div>
    </div>

    <div class="card mb-16">
      <div class="form-row">
        <div class="form-group">
          <label>Class</label>
          <select id="class-select"></select>
        </div>
        <div class="form-group">
          <label>Exam</label>
          <select id="exam-select"></select>
        </div>
        <div class="form-group">
          <label>Max Marks (for this exam)</label>
          <input type="number" id="max-marks-input" value="100" min="1" />
        </div>
      </div>
    </div>

    <div id="marks-region"><div class="state-block"><div class="spinner"></div>Loading...</div></div>
  </div>
</div>

<div id="toast-container"></div>
<div id="modal-root"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/academic.js"></script>
<script src="../js/marks.js"></script>
</body>
</html>
