<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Student Profile</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/dashboard.css" />
<link rel="stylesheet" href="../css/tables.css" />
<link rel="stylesheet" href="../css/forms.css" />
</head>
<body>
<div class="app-shell" id="app-shell">
  <div id="page-content">
    <div class="breadcrumb"><a href="#" id="crumb-back">Students</a> <span class="sep">/</span> <span>Profile</span></div>

    <div id="profile-region"><div class="state-block"><div class="spinner"></div>Loading student profile...</div></div>

    <div id="profile-body" class="hidden">
      <div class="tabs">
        <button class="tab-btn active" data-tab="personal">Personal</button>
        <button class="tab-btn" data-tab="academic">Academic Performance</button>
        <button class="tab-btn" data-tab="attendance">Attendance</button>
        <button class="tab-btn" data-tab="documents">Documents</button>
      </div>

      <div class="tab-panel active" id="tab-personal">
        <div class="card">
          <h3>Personal Information</h3>
          <div class="profile-meta-grid" id="personal-info"></div>
          <div class="form-section-title">Parent / Guardian Information</div>
          <div class="profile-meta-grid" id="parent-info"></div>
        </div>
      </div>

      <div class="tab-panel" id="tab-academic">
        <div class="card">
          <div class="table-toolbar">
            <h3 class="mb-0">Marks</h3>
            <select id="academic-exam-select" style="min-width:200px;"></select>
          </div>
          <div id="academic-region"></div>
        </div>
      </div>

      <div class="tab-panel" id="tab-attendance">
        <div class="stat-grid" id="attendance-stats"></div>
        <div class="card">
          <h3>Class Attendance History</h3>
          <div id="attendance-history-region"></div>
        </div>
      </div>

      <div class="tab-panel" id="tab-documents">
        <div class="card">
          <div class="card-title-row">
            <h3 class="mb-0">Documents</h3>
            <button class="btn btn-primary btn-sm hidden" id="upload-doc-btn">⬆️ Upload Document</button>
          </div>
          <div id="documents-region"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<div id="modal-root"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/academic.js"></script>
<script src="../js/student-profile.js"></script>
</body>
</html>
