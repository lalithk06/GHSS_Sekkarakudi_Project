<!DOCTYPE html>
<html lang="en">
<head>

<title>Rankings</title>
<link rel="stylesheet" href="../css/style.css" />

<div class="app-shell" id="app-shell">

      <div>
        <h1>Rankings</h1>
        <p>Class-wise student rankings by exam.</p>
      </div>
    </div>

    <div class="card mb-16">
      <div class="form-row">
        <div class="form-group"><label>Standard</label><select id="std-select"></select></div>

      </div>
    </div>

    <div class="card">
      <div id="ranking-region"><div class="state-block"><div class="spinner"></div>Loading...</div></div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<div id="modal-root"></div>

<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
