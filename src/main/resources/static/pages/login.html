<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login - GHSS Sekkarakudi</title>
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/forms.css" />
<link rel="stylesheet" href="../css/login.css" />
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <div class="logo-mark">GH</div>
        <div class="brand-text">GHSS<small>Sekkarakudi</small></div>
      </div>
      <h1>Welcome back</h1>
      <p class="subtitle">Sign in with your school account to continue.</p>

      <div id="login-alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="username">Username <span class="req">*</span></label>
          <input type="text" id="username" name="username" autocomplete="username" required />
          <div class="field-error" data-error-for="username"></div>
        </div>
        <div class="form-group">
          <label for="password">Password <span class="req">*</span></label>
          <input type="password" id="password" name="password" autocomplete="current-password" required />
          <div class="field-error" data-error-for="password"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="login-btn">Login</button>
      </form>
    </div>
    <div class="login-footer-note">Having trouble signing in? Contact your school administrator.</div>
  </div>

  <div id="toast-container"></div>
  <div id="modal-root"></div>

  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
